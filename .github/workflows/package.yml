name: Packaging Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'wix/**'
      - 'packaging/**'
      - 'scripts/package_*'
      - 'scripts/smoke_test*'
      - '.github/workflows/package.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version string to package (defaults to Cargo.toml version)'
        required: false
        default: ''
  push:
    tags:
      - 'v*-rc*'
      - 'v*-beta*'
      - 'v*-alpha*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-metadata:
    name: Verify Package Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Determine target package version
        id: get-version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="lavaterm") | .version')
          OVERRIDE="${{ github.event.inputs.version_override }}"
          VERSION="${OVERRIDE:-$CARGO_VERSION}"

          echo "Detected Cargo Package Ver: $CARGO_VERSION"
          echo "Packaging Target Ver:       $VERSION"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  package-linux:
    name: Validate Linux Packaging (AppImage & DEB x86_64)
    needs: verify-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

      - name: Build Linux packages (.AppImage & .deb)
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          ./scripts/package_linux.sh target/x86_64-unknown-linux-gnu/release/lavaterm dist

      - name: Validate Linux packages & generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          APPIMAGE="ZenLavaTerm-v${VERSION}-linux-x86_64.AppImage"
          DEB="ZenLavaTerm-v${VERSION}-linux-x86_64.deb"

          test -s "$APPIMAGE" || { echo "::error::AppImage is missing or empty"; exit 1; }
          test -x "$APPIMAGE" || { echo "::error::AppImage is not executable"; exit 1; }
          test -s "$DEB" || { echo "::error::DEB package is missing or empty"; exit 1; }

          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          sha256sum "$APPIMAGE" > "${APPIMAGE}.sha256"
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Run packaged Linux smoke test suite (AppImage & extracted DEB)
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          rm -rf target/deb_test
          mkdir -p target/deb_test
          dpkg-deb -x "dist/ZenLavaTerm-v${VERSION}-linux-x86_64.deb" target/deb_test
          python3 scripts/smoke_test.py target/x86_64-unknown-linux-gnu/release/lavaterm --require-packages --version "$VERSION"

      - name: Upload Linux validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-linux
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.AppImage
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.AppImage.sha256
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.deb
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.deb.sha256
          if-no-files-found: error
          retention-days: 3

  package-windows:
    name: Validate Windows Packaging (MSI x86_64)
    needs: verify-metadata
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -or -not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (-not (Test-Path "$wixPath\candle.exe")) {
              $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
            }
            if (Test-Path "$wixPath\candle.exe") {
              echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset --no-progress
              echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose

      - name: Build Windows MSI Package
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -SourceBinaryDir "target\x86_64-pc-windows-msvc\release" -OutputDir "dist" -Version "$env:VERSION"

      - name: Validate Windows MSI install, execution, uninstall & generate checksum
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $msiPath = (Resolve-Path "dist\ZenLavaTerm-v$($env:VERSION)-windows-x86_64.msi").Path
          if (-not (Test-Path $msiPath) -or ((Get-Item $msiPath).Length -eq 0)) {
            Write-Error "::error::MSI installer is missing or empty"
            exit 1
          }

          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msiPath`" /qn /norestart /L*v target\msi_install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content target\msi_install.log -Tail 40
            Write-Error "::error::MSI silent install failed with exit code $($install.ExitCode)"
            exit 1
          }

          $installedExe = "C:\Program Files\ZenLavaTerm\lavaterm.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "::error::Installed executable missing at $installedExe"
            exit 1
          }

          & $installedExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedExe --headless --frames 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList "/x `"$msiPath`" /qn /norestart /L*v target\msi_uninstall.log" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Get-Content target\msi_uninstall.log -Tail 40
            Write-Error "::error::MSI silent uninstall failed with exit code $($uninstall.ExitCode)"
            exit 1
          }
          if (Test-Path $installedExe) {
            Write-Error "::error::Installed executable still present after MSI uninstall"
            exit 1
          }

          $hash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $msiFile = Split-Path -Leaf $msiPath
          Set-Content -Path "dist\$msiFile.sha256" -Value "$hash  $msiFile" -Encoding ascii

      - name: Upload Windows validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-windows
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-windows-x86_64.msi
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-windows-x86_64.msi.sha256
          if-no-files-found: error
          retention-days: 3

  package-macos:
    name: Validate macOS Packaging (Universal DMG)
    needs: verify-metadata
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binaries (Apple Silicon & Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin --verbose
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/lavaterm \
            target/aarch64-apple-darwin/release/lavaterm \
            target/x86_64-apple-darwin/release/lavaterm
          lipo -info target/universal/release/lavaterm

      - name: Build macOS DMG package
        run: |
          ./scripts/package_macos.sh universal target/universal/release/lavaterm dist

      - name: Validate macOS DMG & generate checksum
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          DMG="ZenLavaTerm-v${VERSION}-macos-universal.dmg"
          test -s "$DMG" || { echo "::error::DMG image is missing or empty"; exit 1; }
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Upload macOS validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-macos
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-macos-universal.dmg
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 3

  validate-artifacts:
    name: Verify Consolidated Artifact Manifest
    needs:
      - verify-metadata
      - package-linux
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all validation bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Validate all installer checksums and build consolidated manifest
        working-directory: dist
        run: |
          echo "=== Downloaded Staging Assets ==="
          ls -la

          echo "=== Verifying downloaded installers against builder checksums ==="
          for sha_file in *.sha256; do
            echo "Verifying $sha_file..."
            sha256sum -c "$sha_file"
          done

          echo "=== Generating consolidated SHA256SUMS.txt manifest ==="
          cat *.sha256 | sort -k2 -u > SHA256SUMS.txt

          echo "=== Consolidated Manifest Content ==="
          cat SHA256SUMS.txt

          echo "=== Final verification pass against consolidated manifest ==="
          sha256sum -c SHA256SUMS.txt
          echo "✅ All 4 official desktop installers successfully generated and verified!"
