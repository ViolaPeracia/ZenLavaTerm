name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: Code Quality & Linting (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-linux:
    name: Test Suite (Linux x86_64 glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Run unit & integration tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Verify benchmarks compile
        run: cargo bench --no-run --target x86_64-unknown-linux-gnu

      - name: Build binary & run smoke test suite (PTY, Signals, TUI, Audio)
        run: |
          cargo build --bin lavaterm --target x86_64-unknown-linux-gnu
          python3 scripts/smoke_test.py target/x86_64-unknown-linux-gnu/debug/lavaterm

  test-cross-platform:
    name: Representative Platform (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }}

      - name: Run Windows smoke test suite
        if: runner.os == 'Windows'
        run: |
          cargo build --bin lavaterm --target ${{ matrix.target }}
          powershell -ExecutionPolicy Bypass -File scripts/smoke_test_windows.ps1 -BinaryPath target\${{ matrix.target }}\debug\lavaterm.exe

      - name: Run headless smoke test & Intel cross-target check (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo run --target ${{ matrix.target }} -- --headless --frames 30
          cargo check --target x86_64-apple-darwin

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-audit

      - name: Run RustSec advisory audit
        run: cargo audit
